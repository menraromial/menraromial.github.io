<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Menra Romial - monogram: prompt ">_" with leaf growing from the cursor -->
  <rect width="96" height="96" fill="#fff7f1"/>
  <g fill="none" stroke="#ff6347" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- chevron ">" -->
    <polyline points="16,26 44,48 16,70"/>
  </g>
  <!-- underscore cursor -->
  <rect x="54" y="64" width="30" height="12" rx="6" fill="#ff6347"/>
  <!-- stem -->
  <path d="M73 64 C73 59 73 56 73 52" fill="none" stroke="#ff6347" stroke-width="5" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M73 52 C71 40 77 29 90 27 C92 40 86 50 73 52 Z" fill="#ff6347"/>
  <path d="M75 50 L87 31" fill="none" stroke="#fff7f1" stroke-width="2.4" stroke-linecap="round"/>
</svg>
