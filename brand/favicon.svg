<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon: prompt ">" merged with a leaf (upper arm of the chevron IS the leaf) -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#fff7f1" stroke="#45372B" stroke-opacity="0.25" stroke-width="1"/>
  <!-- upper arm as leaf: pointed at (8,7) and (21.5,16), bulging below -->
  <path d="M8 7 C16.5 7.5 20.5 11 21.5 16 C13.5 15.5 9 12.5 8 7 Z" fill="#ff6347"/>
  <!-- vein -->
  <path d="M9.5 8.5 L19.5 15" fill="none" stroke="#fff7f1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- lower arm of the chevron -->
  <path d="M21.5 16 L8.5 24.5" fill="none" stroke="#ff6347" stroke-width="5" stroke-linecap="round"/>
</svg>
